<!DOCTYPE html>
<html>
<head>
    <title>Backup and Restore System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .section h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .status { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background-color: #dff0d8; color: #3c763d; }
        .error { background-color: #f2dede; color: #a94442; }
        .warning { background-color: #fcf8e3; color: #8a6d3b; }
        .nav-link { display: inline-block; margin-right: 15px; padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .nav-link:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Backup and Restore System</h1>
        <a href="/admin-settings" class="nav-link">Admin Settings</a>

        <div class="section">
            <h2>System Status</h2>
            <p>Welcome to the Backup and Restore System. Use the navigation link above to access admin settings.</p>
        </div>
    </div>
</body>
</html>
